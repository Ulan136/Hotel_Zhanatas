<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDINA — кабинет</title><link rel="stylesheet" href="styles.css">
</head><body>
<div class="wrap">
  <div class="top"><div class="logo">🏨</div>
    <div><h1>MEDINA</h1><div class="sub" id="sub">кабинет</div></div>
    <div class="right" id="topRight"></div>
  </div>
  <div class="content" id="c"></div>
  <div class="tabbar" id="tb" style="display:none"></div>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div id="busy"><div class="sp"></div></div>
<script src="config.js"></script>
<script>
var C=document.getElementById('c'), TB=document.getElementById('tb');
var DB={rooms:[],guests:[],stays:[],finance:[],shifts:[],staff:[],categories:[],guards:[]};
var SESS=null;
function sess(){try{return JSON.parse(localStorage.getItem('medina_sess'));}catch(e){return null;}}
function setSess(s){try{localStorage.setItem('medina_sess',JSON.stringify(s));}catch(e){}}
function logout(){try{localStorage.removeItem('medina_sess');}catch(e){}location.reload();}
function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function modal(h){document.getElementById('modal').innerHTML='<div class="grab"></div>'+h;document.getElementById('mbg').classList.add('show');}
function closeModal(){document.getElementById('mbg').classList.remove('show');}
document.getElementById('mbg').addEventListener('click',function(e){if(e.target===this)closeModal();});
var UNITS=['кг','г','л','шт','упак','ящ'];

async function reload(){ DB=await api('bootstrap'); }

/* ---------- вход ---------- */
async function boot(){
  SESS=sess();
  if(SESS){ return openApp(); }
  busy(true); var h={hasAdmin:false}; try{h=await api('hasAdmin');}catch(e){C.innerHTML='<div class="card">Нет связи с базой. Проверьте API_URL в config.js.</div>';busy(false);return;} busy(false);
  if(!h.hasAdmin) regScreen(); else loginScreen();
}
function regScreen(){
  document.getElementById('sub').textContent='регистрация администратора';
  C.innerHTML='<div class="card"><h2>Регистрация администратора</h2><div class="small">Первый пользователь — админ.</div>'+
    '<label>Имя</label><input id="rn"><label>Логин</label><input id="rl"><label>Пароль</label><input id="rp" type="password">'+
    '<button class="btn" onclick="doReg()">Зарегистрироваться</button></div>';
}
async function doReg(){
  if(!v('rn')||!v('rl')||!v('rp'))return alert('Заполните все поля');
  busy(true); var r=await api('register',{name:v('rn'),login:v('rl'),pass:v('rp'),role:'admin'}); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); setSess({name:v('rn'),login:v('rl'),role:'admin'}); openApp();
}
function loginScreen(){
  document.getElementById('sub').textContent='вход';
  C.innerHTML='<div class="card"><h2>Вход</h2><label>Логин</label><input id="ll"><label>Пароль</label><input id="lp" type="password">'+
    '<button class="btn" onclick="doLogin()">Войти</button>'+
    '<div class="link" style="margin-top:12px" onclick="addStaff()">+ Добавить сотрудника (ресепшн)</div></div>';
}
async function doLogin(){
  busy(true); var r=await api('login',{login:v('ll'),pass:v('lp')}); busy(false);
  if(!r.ok||r.user.role==='factory')return alert('Неверный логин или пароль');
  setSess({name:r.user.name,login:r.user.login,role:r.user.role}); openApp();
}
async function addStaff(){
  var n=prompt('Имя сотрудника:');if(!n)return;var l=prompt('Логин:');if(!l)return;var p=prompt('Пароль:');if(!p)return;
  busy(true);var r=await api('register',{name:n,login:l,pass:p,role:'reception'});busy(false);
  alert(r.ok?'Сотрудник добавлен':(r.error||'Ошибка'));
}

/* ---------- приложение ---------- */
async function openApp(){
  SESS=sess();
  document.getElementById('sub').textContent=SESS.name+' · '+(SESS.role==='admin'?'админ':'ресепшн');
  document.getElementById('topRight').innerHTML='<span class="link" style="color:#fff;margin-right:12px" onclick="settingsScreen()">⚙ Настройки</span><span class="link" style="color:#fff" onclick="logout()">выйти</span>';
  busy(true); try{await reload();}catch(e){C.innerHTML='<div class="card">Нет связи с базой.</div>';busy(false);return;} busy(false);
  tab('rooms');
}
function tab(t){
  TB.style.display='flex';
  TB.innerHTML=[['rooms','▦','Комнаты'],['fin','₸','Расходы'],['shifts','🕒','Смены'],['rep','📄','Отчёт']]
    .map(function(x){return '<button class="'+(t===x[0]?'active':'')+'" onclick="tab(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span>'+x[2]+'</button>';}).join('');
  ({rooms:rooms_,fin:fin_,shifts:shifts_,rep:rep_})[t]();
}

/* --- Комнаты --- */
function rooms_(){
  var occ=0,free=0;
  var grid=DB.rooms.map(function(r){
    var cls=r.status==='free'?'free':(r.status==='occ'?'occ':'book');
    if(r.status==='free')free++;else occ++;
    var s=r.status==='free'?'свободно':(r.status==='occ'?'занято':'бронь');
    return '<div class="room '+cls+'" onclick="roomClick('+r.room+')"><div class="bar"></div><div class="n">'+r.room+'</div><div class="s">'+s+'</div></div>';
  }).join('');
  C.innerHTML='<div class="card"><h2>Комнаты</h2>'+
    '<div class="legend"><span><i class="dot" style="background:var(--free)"></i>свободно</span><span><i class="dot" style="background:var(--full)"></i>занято</span><span><i class="dot" style="background:var(--part)"></i>бронь</span></div>'+
    '<div class="tiles" style="margin-bottom:12px"><div class="tile" style="background:var(--fullbg)"><div class="v" style="color:#991b1b">'+occ+'</div><div class="l" style="color:#991b1b">занято</div></div>'+
    '<div class="tile" style="background:var(--freebg)"><div class="v" style="color:#065f46">'+free+'</div><div class="l" style="color:#065f46">свободно</div></div></div>'+
    '<div class="rooms">'+grid+'</div></div>';
}
function roomClick(n){
  var r=DB.rooms.find(function(x){return x.room===n;});
  if(r.status==='free'){ checkinModal(n); }
  else{ var s=r.stay;
    modal('<h2>Комната № '+n+'</h2>'+
      '<div class="list-item"><div class="avatar">'+initials(s['ФИО'])+'</div><div style="flex:1"><div style="font-weight:700">'+esc(s['ФИО'])+'</div><div class="small">'+(s['Источник']||'')+'</div></div>'+(s['Статус']==='booked'?'<span class="chip a">бронь</span>':'<span class="chip g">на смене</span>')+'</div>'+
      '<div class="tiles"><div class="tile" style="background:var(--freebg)"><div class="l" style="color:#065f46">Прибытие</div><div class="v" style="font-size:16px;color:#065f46">'+fmt(s['Прибытие'])+'</div></div>'+
      '<div class="tile" style="background:var(--partbg)"><div class="l" style="color:#92400e">Выбытие</div><div class="v" style="font-size:16px;color:#92400e">'+fmt(s['Выбытие'])+'</div></div></div>'+
      '<div class="small" style="margin:10px 0">Суток: <b>'+(s['Суток']||nights(s['Прибытие'],s['Выбытие']))+'</b></div>'+
      '<button class="btn red" onclick="checkout(\''+s.id+'\')">Отметить выбытие</button><button class="btn sec" onclick="closeModal()">Закрыть</button>');
  }
}
function checkinModal(n){
  var opts=DB.guests.map(function(g){return '<option value="'+g.id+'">'+esc(g['ФИО'])+'</option>';}).join('');
  modal('<h2>Заселить · комната № '+n+'</h2><label>Гость</label><select id="cg">'+opts+'</select>'+
    '<label>Прибытие</label><input type="date" id="ca"><label>Выбытие</label><input type="date" id="cb">'+
    '<button class="btn" onclick="doCheckin('+n+')">Заселить</button><button class="btn sec" onclick="closeModal()">Отмена</button>');
  document.getElementById('ca').value=todayStr();
}
async function doCheckin(n){
  var gid=document.getElementById('cg').value, a=document.getElementById('ca').value, b=document.getElementById('cb').value;
  if(!a||!b)return alert('Укажите период');
  var g=DB.guests.find(function(x){return String(x.id)===String(gid);});
  busy(true); var r=await api('checkin',{guestId:gid,fio:g['ФИО'],room:n,arrival:a,departure:b,source:'ресепшн'}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); closeModal(); tab('rooms');
}
async function checkout(id){ busy(true); await api('checkout',{id:id}); await reload(); busy(false); closeModal(); tab('rooms'); }

/* ================= ЕДИНАЯ СТРАНИЦА «НАСТРОЙКИ» ================= */
var SEG='guests', STAFF_ROLES=['Повар','Помощник повара','Ресепшн','Уборка','Охрана','Другое'];
function roleChip(r){return r==='admin'?'<span class="chip" style="background:var(--eef);color:var(--primd)">Админ</span>':(r==='reception'?'<span class="chip g">Ресепшн</span>':'<span class="chip a">Заказчик</span>');}
function rowHtml(av,title,sub,editCall,delCall){
  return '<div class="list-item"><div class="avatar">'+av+'</div><div style="flex:1"><div style="font-weight:600">'+esc(title)+'</div><div class="small">'+sub+'</div></div>'+
    '<span class="link" onclick="'+editCall+'">изм.</span>&nbsp;&nbsp;<span class="link" style="color:var(--full)" onclick="'+delCall+'">удал.</span></div>';
}
async function settingsScreen(seg){
  SEG=seg||SEG||'guests';
  TB.style.display='none';
  var segs=[['guests','Гости'],['staff','Работники'],['cats','Категории']];
  if(SESS.role==='admin') segs.unshift(['users','Пользователи']);
  if(SEG==='users'&&SESS.role!=='admin') SEG='guests';
  var segBar='<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'+segs.map(function(s){return '<button class="btn '+(SEG===s[0]?'':'sec')+'" style="flex:1 1 30%;margin:0;padding:9px 4px;font-size:13px;min-width:84px" onclick="settingsScreen(\''+s[0]+'\')">'+s[1]+'</button>';}).join('')+'</div>';
  var head='<div class="card"><h2>⚙ Настройки</h2><div class="small">Пользователи — доступ по логину; Гости — кто заселяется; Работники — персонал; Категории — статьи доходов и расходов.</div>'+segBar+'</div>';
  var list='';
  if(SEG==='users'){
    busy(true); var us=[]; try{us=await api('users');}catch(e){} busy(false); window._users=us;
    list='<div class="card"><button class="btn" onclick="userModal()">+ Добавить пользователя</button>'+
      (us.length?'<div style="margin-top:12px">'+us.map(function(u){return rowHtml(initials(u.name),u.name,esc(u.login)+' &nbsp; '+roleChip(u.role),'userModal(\''+encodeURIComponent(u.login)+'\')','delUser(\''+encodeURIComponent(u.login)+'\')');}).join('')+'</div>':'<div class="small" style="margin-top:10px">Пока нет пользователей.</div>')+'</div>';
  }else if(SEG==='guests'){
    list='<div class="card"><button class="btn" onclick="guestModal()">+ Добавить гостя</button>'+
      (DB.guests.length?'<div style="margin-top:12px">'+DB.guests.map(function(x){var inr=DB.stays.find(function(s){return String(s.guestId)===String(x.id)&&s['Статус']!=='closed';});var idE=encodeURIComponent(String(x.id));return rowHtml(initials(x['ФИО']),x['ФИО'],esc(x['Компания']||'')+(x['Телефон']?' · '+esc(x['Телефон']):'')+(inr?' · <b style="color:#065f46">№'+inr['Комната']+'</b>':''),'guestModal(\''+idE+'\')','delGuest(\''+idE+'\')');}).join('')+'</div>':'<div class="small" style="margin-top:10px">Пока нет гостей.</div>')+'</div>';
  }else if(SEG==='staff'){
    var st=DB.staff||[];
    list='<div class="card"><button class="btn" onclick="staffModal()">+ Добавить работника</button><div class="small" style="margin-top:8px">Работники с должностью «Охрана» видны на странице охраны (guard.html).</div>'+
      (st.length?'<div style="margin-top:12px">'+st.map(function(x){var idE=encodeURIComponent(String(x.id));return rowHtml(initials(x['ФИО']),x['ФИО'],esc(x['Должность']||'')+(x['Телефон']?' · '+esc(x['Телефон']):''),'staffModal(\''+idE+'\')','delStaff(\''+idE+'\')');}).join('')+'</div>':'<div class="small" style="margin-top:10px">Пока нет работников.</div>')+'</div>';
  }else{
    var cs=DB.categories||[];
    var tops=cs.filter(function(c){return !(c['Родитель']&&String(c['Родитель']).length);});
    var subsOf=function(pid){return cs.filter(function(c){return String(c['Родитель']||'')===String(pid);});};
    var html='';
    tops.forEach(function(c){
      var idE=encodeURIComponent(String(c.id));
      var ch=c['Тип']==='income'?'<span class="chip g">доход</span>':'<span class="chip a">расход</span>';
      html+='<div class="list-item"><div class="avatar">₸</div><div style="flex:1"><div style="font-weight:600">'+esc(c['Название'])+' &nbsp; '+ch+'</div><div class="small"><span class="link" onclick="catModal(null,\''+idE+'\',\''+c['Тип']+'\')">+ подкатегория</span></div></div>'+
        '<span class="link" onclick="catModal(\''+idE+'\')">изм.</span>&nbsp;&nbsp;<span class="link" style="color:var(--full)" onclick="delCat(\''+idE+'\')">удал.</span></div>';
      subsOf(c.id).forEach(function(s){var sE=encodeURIComponent(String(s.id));
        html+='<div class="list-item" style="margin-left:22px;background:#fff"><div style="flex:1;font-weight:500">↳ '+esc(s['Название'])+'</div><span class="link" onclick="catModal(\''+sE+'\')">изм.</span>&nbsp;&nbsp;<span class="link" style="color:var(--full)" onclick="delCat(\''+sE+'\')">удал.</span></div>';
      });
    });
    list='<div class="card"><button class="btn" onclick="catModal()">+ Добавить категорию</button><div class="small" style="margin-top:8px">Категория (напр. «Продукты») и её подкатегории/виды (напр. «Мясо», «Овощи»). По ним отчёт покажет суммы.</div></div>'+
      '<div class="card">'+(tops.length?html:'<div class="small">Пока нет категорий. Добавьте свои статьи расходов и доходов.</div>')+'</div>';
  }
  C.innerHTML=head+list+'<div class="card"><button class="btn sec" onclick="tab(\'rooms\')">← назад в кабинет</button></div>';
}
/* --- Гости --- */
function guestModal(idE){
  var edit=!!idE, g=edit?DB.guests.find(function(x){return encodeURIComponent(String(x.id))===idE;}):null;
  modal('<h2>'+(edit?'Изменить гостя':'Новый гость')+'</h2>'+
    '<label>ФИО</label><input id="gN" value="'+(g?esc(g['ФИО']):'')+'">'+
    '<label>Компания / вахта</label><input id="gC" value="'+(g?esc(g['Компания']||''):'Инжиниринг')+'">'+
    '<label>Телефон</label><input id="gP" value="'+(g?esc(g['Телефон']||''):'')+'">'+
    '<button class="btn" onclick="saveGuest('+(edit?'\''+idE+'\'':'null')+')">Сохранить</button>'+
    '<button class="btn sec" onclick="closeModal()">Отмена</button>');
}
async function saveGuest(idE){
  var fio=v('gN'); if(!fio)return alert('Укажите ФИО');
  busy(true); var r=idE?await api('updateGuest',{id:decodeURIComponent(idE),fio:fio,company:v('gC'),phone:v('gP')}):await api('addGuest',{fio:fio,company:v('gC'),phone:v('gP')}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); closeModal(); settingsScreen('guests');
}
async function delGuest(idE){
  var g=DB.guests.find(function(x){return encodeURIComponent(String(x.id))===idE;});
  if(g){var inr=DB.stays.find(function(s){return String(s.guestId)===String(g.id)&&s['Статус']!=='closed';}); if(inr)return alert('Нельзя удалить: гость сейчас заселён (комната №'+inr['Комната']+'). Сначала отметьте выбытие.');}
  if(!confirm('Удалить гостя?'))return;
  busy(true); var r=await api('deleteGuest',{id:decodeURIComponent(idE)}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); settingsScreen('guests');
}
/* --- Работники (персонал) --- */
function staffModal(idE){
  var edit=!!idE, w=edit?(DB.staff||[]).find(function(x){return encodeURIComponent(String(x.id))===idE;}):null;
  modal('<h2>'+(edit?'Изменить работника':'Новый работник')+'</h2>'+
    '<label>ФИО</label><input id="wN" value="'+(w?esc(w['ФИО']):'')+'">'+
    '<label>Должность</label><select id="wR">'+STAFF_ROLES.map(function(r){return '<option'+(w&&w['Должность']===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>'+
    '<label>Телефон</label><input id="wP" value="'+(w?esc(w['Телефон']||''):'')+'">'+
    '<button class="btn" onclick="saveStaff('+(edit?'\''+idE+'\'':'null')+')">Сохранить</button>'+
    '<button class="btn sec" onclick="closeModal()">Отмена</button>');
}
async function saveStaff(idE){
  var fio=v('wN'); if(!fio)return alert('Укажите ФИО');
  var role=document.getElementById('wR').value, phone=v('wP');
  busy(true); var r=idE?await api('updateStaff',{id:decodeURIComponent(idE),fio:fio,role:role,phone:phone}):await api('addStaff',{fio:fio,role:role,phone:phone}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); closeModal(); settingsScreen('staff');
}
async function delStaff(idE){
  if(!confirm('Удалить работника?'))return;
  busy(true); var r=await api('deleteStaff',{id:decodeURIComponent(idE)}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); settingsScreen('staff');
}
/* --- Категории доходов/расходов --- */
function catModal(idE, parentIdE, ctype){
  var edit=!!idE, c=edit?(DB.categories||[]).find(function(x){return encodeURIComponent(String(x.id))===idE;}):null;
  var isSub = edit ? !!(c&&c['Родитель']&&String(c['Родитель']).length) : !!parentIdE;
  var typeVal = c?c['Тип']:(ctype||'expense');
  var title = edit?(isSub?'Изменить подкатегорию':'Изменить категорию'):(parentIdE?'Новая подкатегория':'Новая категория');
  var typeField = isSub?'' : '<label>Тип</label><select id="kT"><option value="expense"'+(typeVal==='expense'?' selected':'')+'>Расход</option><option value="income"'+(typeVal==='income'?' selected':'')+'>Доход</option></select>';
  modal('<h2>'+title+'</h2><label>Название</label><input id="kN" value="'+(c?esc(c['Название']):'')+'" placeholder="'+(parentIdE?'Напр. Мясо, Овощи':'Напр. Продукты, Коммуналка')+'">'+typeField+
    '<button class="btn" onclick="saveCat('+(edit?'\''+idE+'\'':'null')+','+(parentIdE?'\''+parentIdE+'\'':'null')+',\''+typeVal+'\')">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button>');
}
async function saveCat(idE, parentIdE, typeVal){
  var t=v('kN'); if(!t)return alert('Укажите название');
  var kt=document.getElementById('kT')?document.getElementById('kT').value:typeVal;
  var parentId=parentIdE?decodeURIComponent(parentIdE):'';
  busy(true); var r=idE?await api('updateCategory',{id:decodeURIComponent(idE),title:t,ctype:kt}):await api('addCategory',{title:t,ctype:kt,parent:parentId}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); closeModal(); settingsScreen('cats');
}
async function delCat(idE){
  if(!confirm('Удалить категорию?'))return;
  busy(true); var r=await api('deleteCategory',{id:decodeURIComponent(idE)}); await reload(); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); settingsScreen('cats');
}
/* --- Пользователи (доступ) --- */
function userModal(loginEnc){
  var edit=!!loginEnc, u=edit?window._users.find(function(x){return encodeURIComponent(x.login)===loginEnc;}):null;
  modal('<h2>'+(edit?'Изменить пользователя':'Новый пользователь')+'</h2>'+
    '<label>Имя</label><input id="uName" value="'+(u?esc(u.name):'')+'">'+
    '<label>Логин</label><input id="uLogin" value="'+(u?esc(u.login):'')+'"'+(edit?' readonly style="background:#eef2ff;color:#64748b"':'')+'>'+
    '<label>Пароль'+(edit?' (пусто — не менять)':'')+'</label><input id="uPass" type="text">'+
    '<label>Роль</label><select id="uRole"><option value="admin">Админ (полный доступ)</option><option value="reception">Ресепшн</option><option value="factory">Заказчик (только отчёт)</option></select>'+
    '<button class="btn" onclick="saveUser('+(edit?'true':'false')+')">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button>');
  if(u) document.getElementById('uRole').value=u.role;
}
async function saveUser(edit){
  var name=v('uName'), login=v('uLogin'), pass=v('uPass'), role=document.getElementById('uRole').value;
  if(!name||!login)return alert('Имя и логин обязательны');
  if(!edit&&!pass)return alert('Укажите пароль для нового пользователя');
  busy(true); var r=edit?await api('updateUser',{login:login,name:name,role:role,pass:pass}):await api('addUser',{name:name,login:login,pass:pass,role:role}); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); closeModal(); settingsScreen('users');
}
async function delUser(loginEnc){
  var login=decodeURIComponent(loginEnc);
  if(login===SESS.login)return alert('Нельзя удалить пользователя, под которым вы вошли.');
  if(!confirm('Удалить пользователя «'+login+'»?'))return;
  busy(true); var r=await api('deleteUser',{login:login}); busy(false);
  if(!r.ok)return alert(r.error||'Ошибка'); settingsScreen('users');
}

/* --- Финансы --- */
function fin_(){
  var f=DB.finance;
  var inc=f.filter(function(x){return x['Тип']==='income';}).reduce(function(a,b){return a+ +b['Сумма'];},0);
  var exp=f.filter(function(x){return x['Тип']==='expense';}).reduce(function(a,b){return a+ +b['Сумма'];},0);
  C.innerHTML='<div class="card"><h2>Расходы и доходы</h2><div class="tiles" style="margin-top:8px">'+
    '<div class="tile" style="background:var(--freebg)"><div class="l" style="color:#065f46">Доход</div><div class="v" style="font-size:18px;color:#065f46">'+money(inc)+'</div></div>'+
    '<div class="tile" style="background:var(--fullbg)"><div class="l" style="color:#991b1b">Расход</div><div class="v" style="font-size:18px;color:#991b1b">'+money(exp)+'</div></div></div>'+
    '<div class="tile" style="background:var(--eef);margin-top:10px"><div class="l" style="color:var(--primd)">Остаток (доход − расход)</div><div class="v" style="font-size:20px;color:var(--primd)">'+money(inc-exp)+'</div></div>'+
    '<button class="btn" onclick="addFin()">+ Добавить расход / доход</button></div>'+
    '<div class="card noprint"><h2 style="font-size:15px">Отчёт по расходам (по категориям)</h2><label>с</label><input type="date" id="ff"><label>по</label><input type="date" id="ft2">'+
    '<button class="btn" onclick="finReport()">Показать отчёт</button><button class="btn sec" onclick="window.print()">🖨 Печать / PDF</button></div><div id="finRep"></div>'+
    '<div class="card"><h2 style="font-size:15px">Последние операции</h2>'+(f.length?f.slice().reverse().slice(0,40).map(function(x){var g=x['Тип']==='income';
      return '<div class="list-item"><div style="flex:1"><div style="font-weight:600">'+esc(x['Категория'])+(x['Подкатегория']?' › '+esc(x['Подкатегория']):'')+'</div><div class="small">'+fmt(x['Дата'])+(x['Комментарий']?' · '+esc(x['Комментарий']):'')+'</div></div><div style="font-weight:700;color:'+(g?'#065f46':'#991b1b')+'">'+(g?'+':'−')+money(Math.abs(x['Сумма']))+'</div></div>';
    }).join(''):'<div class="small">Пока нет операций.</div>')+'</div>';
  var d=new Date();document.getElementById('ff').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';document.getElementById('ft2').value=todayStr();
}
function addFin(){
  modal('<h2>Новая операция</h2><label>Тип</label><select id="ft" onchange="fillCats()"><option value="expense">Расход</option><option value="income">Доход</option></select>'+
    '<label>Категория</label><select id="fc" onchange="onCatChange()"></select><input id="fcNew" placeholder="Название новой категории" style="display:none;margin-top:6px">'+
    '<label>Подкатегория (вид)</label><select id="fsub" onchange="subToggle()"></select><input id="fsubNew" placeholder="Название новой подкатегории" style="display:none;margin-top:6px">'+
    '<label>Сумма, ₸</label><input id="fa" type="number"><label>Дата</label><input id="fd" type="date"><label>Комментарий</label><input id="fn">'+
    '<button class="btn" onclick="saveFin()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button>');
  document.getElementById('fd').value=todayStr(); fillCats();
}
function topCats(t){return (DB.categories||[]).filter(function(c){return c['Тип']===t&&!(c['Родитель']&&String(c['Родитель']).length);});}
function subCats(parentId){return (DB.categories||[]).filter(function(c){return String(c['Родитель']||'')===String(parentId);});}
function fillCats(){
  var t=document.getElementById('ft').value;
  document.getElementById('fc').innerHTML=topCats(t).map(function(c){return '<option value="'+c.id+'">'+esc(c['Название'])+'</option>';}).join('')+'<option value="__new__">➕ Новая категория…</option>';
  onCatChange();
}
function onCatChange(){
  var sel=document.getElementById('fc').value;
  document.getElementById('fcNew').style.display=(sel==='__new__')?'':'none';
  fillSubs();
}
function fillSubs(){
  var sel=document.getElementById('fc').value;
  var subs=(sel&&sel!=='__new__')?subCats(sel):[];
  document.getElementById('fsub').innerHTML='<option value="">— без подкатегории —</option>'+subs.map(function(c){return '<option>'+esc(c['Название'])+'</option>';}).join('')+'<option value="__new__">➕ Новая подкатегория…</option>';
  subToggle();
}
function subToggle(){document.getElementById('fsubNew').style.display=(document.getElementById('fsub').value==='__new__')?'':'none';}
async function saveFin(){
  var a=parseFloat(document.getElementById('fa').value); if(!a)return alert('Укажите сумму');
  var t=document.getElementById('ft').value, catSel=document.getElementById('fc').value;
  var catName, parentId;
  busy(true);
  if(catSel==='__new__'){ catName=v('fcNew'); if(!catName){busy(false);return alert('Укажите категорию');} var rc=await api('addCategory',{title:catName,ctype:t}); parentId=rc.id||''; }
  else { var c=(DB.categories||[]).find(function(x){return String(x.id)===String(catSel);}); if(!c){busy(false);return alert('Выберите категорию');} catName=c['Название']; parentId=c.id; }
  var subSel=document.getElementById('fsub').value, subName='';
  if(subSel==='__new__'){ subName=v('fsubNew'); if(subName) await api('addCategory',{title:subName,ctype:t,parent:parentId}); }
  else if(subSel) subName=subSel;
  await api('addFinance',{type:t,category:catName,subcategory:subName,amount:a,date:document.getElementById('fd').value,note:v('fn')});
  await reload(); busy(false); closeModal(); tab('fin');
}
function finReport(){
  var from=v('ff'),to=v('ft2');
  var ops=DB.finance.filter(function(x){return x['Тип']==='expense';});
  if(from)ops=ops.filter(function(x){return String(x['Дата']).slice(0,10)>=from;});
  if(to)ops=ops.filter(function(x){return String(x['Дата']).slice(0,10)<=to;});
  var total=ops.reduce(function(a,b){return a+ +b['Сумма'];},0);
  var grp={};
  ops.forEach(function(x){var c=x['Категория']||'(без категории)', s=x['Подкатегория']||'— без подкатегории —';
    if(!grp[c])grp[c]={sum:0,subs:{}}; grp[c].sum+= +x['Сумма']; grp[c].subs[s]=(grp[c].subs[s]||0)+ +x['Сумма'];});
  var cats=Object.keys(grp).sort(function(a,b){return grp[b].sum-grp[a].sum;});
  var body='';
  cats.forEach(function(c){
    body+='<tr style="background:var(--panel)"><td style="font-weight:700">'+esc(c)+'</td><td style="text-align:right;font-weight:700;color:#991b1b">'+money(grp[c].sum)+'</td></tr>';
    Object.keys(grp[c].subs).sort(function(a,b){return grp[c].subs[b]-grp[c].subs[a];}).forEach(function(s){
      body+='<tr><td style="padding-left:22px;color:#475569">'+esc(s)+'</td><td style="text-align:right">'+money(grp[c].subs[s])+'</td></tr>';
    });
  });
  document.getElementById('finRep').innerHTML='<div class="card"><div style="font-weight:700;margin-bottom:2px">Отчёт по расходам</div>'+
    '<div class="small" style="margin-bottom:8px">'+(from?fmt(from):'начало')+' – '+(to?fmt(to):'сегодня')+'</div>'+
    '<div class="tile" style="background:var(--fullbg);margin-bottom:10px"><div class="v" style="font-size:20px;color:#991b1b">'+money(total)+'</div><div class="l" style="color:#991b1b">всего расходов</div></div>'+
    (cats.length?'<div style="overflow:auto"><table><tr><th>Категория / подкатегория</th><th style="text-align:right">Сумма</th></tr>'+body+'</table></div>':'<div class="small">Нет расходов за период.</div>')+'</div>';
}

/* --- Смены --- */
function shiftLabel(t){return t==='day'?'День 08:00–20:00':(t==='night'?'Ночь 20:00–08:00':'Своя');}
function shifts_(){
  var sh=DB.shifts.slice().sort(function(a,b){return (a['Дата']<b['Дата'])?1:-1;});
  var hours=sh.reduce(function(a,b){return a+(+b['Часы']||0);},0);
  C.innerHTML='<div class="card"><h2>Смены персонала</h2><div class="small">Охрана отмечает приход/уход по QR — часы считаются автоматически.</div>'+
    '<div class="tiles" style="margin-top:10px"><div class="tile" style="background:var(--eef)"><div class="v" style="font-size:18px;color:var(--primd)">'+sh.length+'</div><div class="l" style="color:var(--primd)">смен</div></div>'+
    '<div class="tile" style="background:var(--freebg)"><div class="v" style="font-size:18px;color:#065f46">'+hours+'</div><div class="l" style="color:#065f46">часов</div></div></div>'+
    '<button class="btn" onclick="addSh()">+ Добавить смену</button><div class="small" style="margin-top:8px">Охранников заводите в «⚙ Настройки → Работники» (должность «Охрана»).</div></div>'+
    '<div class="card noprint"><h2 style="font-size:15px">Табель за период</h2><label>с</label><input type="date" id="tf"><label>по</label><input type="date" id="tt">'+
    '<button class="btn" onclick="tabel()">Показать табель</button><button class="btn sec" onclick="window.print()">🖨 Печать</button></div><div id="tRep"></div>'+
    '<div class="card"><h2 style="font-size:15px">График смен</h2>'+(sh.length?'<div style="overflow:auto"><table><tr><th>Дата</th><th>Сотрудник</th><th>Должн.</th><th>Смена</th><th>Ч</th><th>Подтв.</th></tr>'+
      sh.map(function(x){var conf=x['Подтверждено']==='да'?'<span style="color:#065f46;font-weight:700">✓</span>':(x['Должность']==='Охрана'?'<span style="color:#92400e">ждёт</span>':'—');
        var sm=x['Приход']?(timeHM(x['Приход'])+'–'+(x['Уход']?timeHM(x['Уход']):'…')):shiftLabel(x['Смена']);
        return '<tr><td>'+fmt(x['Дата'])+'</td><td style="font-weight:600">'+esc(x['ФИО'])+'</td><td>'+esc(x['Должность']||'')+'</td><td>'+esc(sm)+'</td><td>'+(x['Приход']&&!x['Уход']?'…':(x['Часы']||''))+'</td><td>'+conf+'</td></tr>';
      }).join('')+'</table></div>':'<div class="small">Смен нет.</div>')+'</div>';
  var d=new Date();document.getElementById('tf').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';document.getElementById('tt').value=todayStr();
}
function tabel(){
  var from=v('tf'),to=v('tt');var sh=DB.shifts.filter(function(x){return (!from||String(x['Дата']).slice(0,10)>=from)&&(!to||String(x['Дата']).slice(0,10)<=to);});
  var agg={};sh.forEach(function(x){var k=x['ФИО']+'|'+(x['Должность']||'');if(!agg[k])agg[k]={name:x['ФИО'],role:x['Должность'],cnt:0,h:0};agg[k].cnt++;agg[k].h+=(+x['Часы']||0);});
  var rows=Object.keys(agg).map(function(k){return agg[k];}).sort(function(a,b){return b.h-a.h;});var th=rows.reduce(function(a,b){return a+b.h;},0);
  document.getElementById('tRep').innerHTML='<div class="card"><div style="font-weight:700">Табель за период</div><div class="small" style="margin-bottom:8px">'+(from?fmt(from):'начало')+' – '+(to?fmt(to):'сегодня')+' · всего часов: '+th+'</div>'+
    (rows.length?'<div style="overflow:auto"><table><tr><th>Сотрудник</th><th>Должн.</th><th>Смен</th><th>Часов</th></tr>'+rows.map(function(r){return '<tr><td style="font-weight:600">'+esc(r.name)+'</td><td>'+esc(r.role||'')+'</td><td>'+r.cnt+'</td><td style="font-weight:700">'+r.h+'</td></tr>';}).join('')+'</table></div>':'<div class="small">Нет смен.</div>')+'</div>';
}
function addSh(){
  modal('<h2>Новая смена</h2><label>Сотрудник</label><input id="sn"><label>Должность</label><select id="sr"><option>Повар</option><option>Помощник повара</option><option>Ресепшн</option><option>Уборка</option><option>Охрана</option><option>Другое</option></select>'+
    '<label>Дата</label><input id="sd" type="date"><label>Смена</label><select id="st"><option value="day">День 08–20</option><option value="night">Ночь 20–08</option><option value="custom">Своя</option></select><label>Часов</label><input id="shh" type="number" value="12">'+
    '<button class="btn" onclick="saveSh()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button>');
  document.getElementById('sd').value=todayStr();
}
async function saveSh(){if(!v('sn'))return alert('Укажите сотрудника');busy(true);await api('addShift',{name:v('sn'),role:document.getElementById('sr').value,date:document.getElementById('sd').value,shift:document.getElementById('st').value,hours:parseFloat(document.getElementById('shh').value)||0});await reload();busy(false);closeModal();tab('shifts');}

/* --- Отчёт --- */
function rep_(){
  var rows=DB.stays.slice().sort(function(a,b){return (a['Прибытие']<b['Прибытие'])?1:-1;});
  var total=rows.reduce(function(a,s){var n=nights(s['Прибытие'],s['Выбытие']);return a+(typeof n==='number'?n:0);},0);
  C.innerHTML='<div class="card noprint"><h2>Отчёт (вахтовый метод)</h2><div class="small">Проживание работников вахтовым методом.</div>'+
    '<button class="btn row" style="margin-top:10px" onclick="window.print()">🖨 Печать / PDF</button></div>'+
    '<div class="card"><div style="font-weight:700">Отчёт о проживании (вахтовый метод)</div><div class="small" style="margin-bottom:10px">Всего проживаний: '+rows.length+' · человеко-суток: '+total+'</div>'+
    '<div style="overflow:auto"><table><tr><th>ФИО</th><th>Комн.</th><th>Прибытие</th><th>Выбытие</th><th>Сут.</th><th>Статус</th></tr>'+
    (rows.length?rows.map(function(s){var st=s['Статус']==='closed'?'закрыт':(s['Статус']==='booked'?'бронь':'на смене');return '<tr><td>'+esc(s['ФИО'])+'</td><td>№'+s['Комната']+'</td><td>'+fmt(s['Прибытие'])+'</td><td>'+fmt(s['Выбытие'])+'</td><td>'+nights(s['Прибытие'],s['Выбытие'])+'</td><td>'+st+'</td></tr>';}).join(''):'<tr><td colspan="6" class="small">Нет заселений.</td></tr>')+'</table></div></div>';
}
boot();
</script>
