<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDINA — охрана</title><link rel="stylesheet" href="styles.css">
</head><body>
<div class="wrap">
  <div class="top"><div class="logo">🛡️</div>
    <div><h1>MEDINA</h1><div class="sub">охрана · учёт по QR</div></div>
    <div class="right"><a class="link" style="color:#fff" href="index.html">на главную</a></div>
  </div>
  <div class="content" id="c"></div>
</div>
<div id="busy"><div class="sp"></div></div>
<script src="config.js"></script>
<script>
var C=document.getElementById('c');
function esc2(s){return esc(s);}

async function start(){
  var name=qParam('name');
  if(name) return statusScreen(name);
  chooseScreen();
}
async function chooseScreen(){
  busy(true);
  var g=[]; try{ g=await api('guards'); }catch(e){ C.innerHTML='<div class="card">Нет связи с базой. Проверьте API_URL и интернет.</div>'; busy(false); return; }
  busy(false);
  C.innerHTML='<div class="card"><h2>🛡️ Учёт смен</h2>'+
    '<div class="small">Выберите себя. Время фиксирует сервер по нажатию.</div>'+
    (g.length?'<div style="margin-top:12px" id="list">'+g.map(function(n){
      return '<div class="list-item" style="cursor:pointer" onclick="statusScreen(\''+encodeURIComponent(n)+'\')"><div class="avatar">'+initials(n)+'</div><div style="flex:1;font-weight:600">'+esc(n)+'</div><span class="chip m">›</span></div>';
    }).join('')+'</div>':'<div class="small" style="margin-top:10px">Список охранников пуст — добавьте в кабинете.</div>')+
    '<div class="link" style="text-align:center;margin-top:8px" onclick="manual()">Ввести имя вручную →</div></div>';
}
function manual(){
  C.innerHTML='<div class="card"><h2>Ваше имя</h2><label>ФИО охранника</label><input id="nm">'+
    '<button class="btn" onclick="var v=document.getElementById(\'nm\').value.trim(); if(v)statusScreen(encodeURIComponent(v));">Далее →</button>'+
    '<div class="link" style="text-align:center;margin-top:10px" onclick="chooseScreen()">← назад</div></div>';
}
async function statusScreen(nameEnc){
  var name=decodeURIComponent(nameEnc);
  busy(true); var st={};
  try{ st=await api('guardStatus',{name:name}); }catch(e){ busy(false); alert('Нет связи с базой'); return; }
  busy(false);
  var body='<div class="card" style="text-align:center"><div class="avatar" style="width:64px;height:64px;font-size:22px;margin:6px auto">'+initials(name)+'</div>'+
    '<h2 style="margin-top:8px">'+esc(name)+'</h2>';
  if(st.open){
    body+='<div><span class="chip g">на смене с '+timeHM(st.checkIn)+'</span></div>'+
      '<div class="small" style="margin:10px 0 14px">Приход: '+fmt(st.date)+' в '+timeHM(st.checkIn)+'. Нажмите, когда уходите.</div>'+
      '<button class="btn red" onclick="doOut(\''+encodeURIComponent(name)+'\')">🚪 Отметить УХОД</button>';
  }else{
    body+='<div><span class="chip m">не на смене</span></div>'+
      '<div class="small" style="margin:10px 0 14px">Нажмите, когда пришли на смену.</div>'+
      '<button class="btn green" onclick="doIn(\''+encodeURIComponent(name)+'\')">✅ Отметить ПРИХОД</button>';
  }
  body+='<div class="link" style="margin-top:12px" onclick="chooseScreen()">← к списку</div></div>';
  C.innerHTML=body;
}
async function doIn(nameEnc){
  var name=decodeURIComponent(nameEnc); busy(true);
  var r=await api('guardIn',{name:name}); busy(false);
  if(!r.ok) return alert(r.error||'Ошибка');
  success('Приход отмечен',name,{'Приход':timeHM(r.checkIn),'Статус':'на смене'});
}
async function doOut(nameEnc){
  var name=decodeURIComponent(nameEnc); busy(true);
  var r=await api('guardOut',{name:name}); busy(false);
  if(!r.ok) return alert(r.error||'Ошибка');
  success('Уход отмечен',name,{'Приход':timeHM(r.checkIn),'Уход':timeHM(r.checkOut),'Отработано':hoursText(r.hours)});
}
function success(title,name,rows){
  var tr=Object.keys(rows).map(function(k){return '<tr><td class="small">'+k+'</td><td style="text-align:right;font-weight:600">'+esc(rows[k])+'</td></tr>';}).join('');
  C.innerHTML='<div class="card" style="text-align:center"><div class="ok-circle"><div class="c">✓</div></div>'+
    '<h2>'+title+'</h2><div class="small">'+esc(name)+'</div></div>'+
    '<div class="card"><table>'+tr+'</table>'+
    '<button class="btn sec" onclick="chooseScreen()">Готово</button></div>';
}
start();
</script>
</body></html>
