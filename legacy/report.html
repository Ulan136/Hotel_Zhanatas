<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDINA — отчёт</title><link rel="stylesheet" href="styles.css">
</head><body>
<div class="wrap">
  <div class="top"><div class="logo">📊</div>
    <div><h1>MEDINA</h1><div class="sub" id="sub">заказчик · отчёт</div></div>
    <div class="right"><a class="link" style="color:#fff" href="index.html">на главную</a></div>
  </div>
  <div class="content" id="c"></div>
</div>
<div id="busy"><div class="sp"></div></div>
<script src="config.js"></script>
<script>
var C=document.getElementById('c');
function loginScreen(){
  C.innerHTML='<div class="card"><h2>🔒 Вход для отчёта</h2>'+
    '<div class="small">Только просмотр отчёта о проживании (вахтовый метод).</div>'+
    '<label>Логин</label><input id="l" placeholder="otchet">'+
    '<label>Пароль</label><input id="p" type="password" placeholder="•••">'+
    '<button class="btn" onclick="doLogin()">Войти</button>'+
    '<div class="small" style="margin-top:12px;background:var(--partbg);color:#92400e;padding:8px 10px;border-radius:8px">Демо-доступ: логин <b>otchet</b> · пароль <b>otchet</b></div></div>';
}
async function doLogin(){
  var l=document.getElementById('l').value.trim(), p=document.getElementById('p').value.trim();
  busy(true); var r=await api('login',{login:l,pass:p}); busy(false);
  if(!r.ok||r.user.role!=='factory')return alert('Неверный логин или пароль');
  reportScreen();
}
function reportScreen(){
  document.getElementById('sub').textContent='заказчик · только просмотр';
  C.innerHTML='<div class="card noprint"><h2>Посещаемость вахты</h2>'+
    '<div class="small">Только просмотр. Данные обновляются автоматически.</div>'+
    '<label>Период с</label><input type="date" id="from">'+
    '<label>по</label><input type="date" id="to">'+
    '<button class="btn" onclick="render()">Показать</button>'+
    '<button class="btn sec" onclick="window.print()">🖨 Печать / PDF</button></div><div id="rep"></div>';
  render();
}
async function render(){
  busy(true); var rows=[]; try{ rows=await api('stays'); }catch(e){} busy(false);
  var from=document.getElementById('from').value, to=document.getElementById('to').value;
  rows=rows.slice().sort(function(a,b){return (a['Прибытие']<b['Прибытие'])?1:-1;});
  if(from)rows=rows.filter(function(s){return String(s['Прибытие']).slice(0,10)>=from;});
  if(to)rows=rows.filter(function(s){return String(s['Прибытие']).slice(0,10)<=to;});
  var total=rows.reduce(function(a,s){var n=nights(s['Прибытие'],s['Выбытие']);return a+(typeof n==='number'?n:0);},0);
  var onshift=rows.filter(function(s){return s['Статус']==='on_shift';}).length;
  document.getElementById('rep').innerHTML='<div class="card">'+
    '<div class="tiles" style="margin-bottom:12px">'+
    '<div class="tile" style="background:var(--freebg)"><div class="v" style="font-size:20px;color:#065f46">'+onshift+'</div><div class="l" style="color:#065f46">сейчас на смене</div></div>'+
    '<div class="tile" style="background:var(--eef)"><div class="v" style="font-size:20px;color:var(--primd)">'+total+'</div><div class="l" style="color:var(--primd)">человеко-суток</div></div></div>'+
    '<div style="font-weight:700;margin-bottom:6px">Отчёт о проживании (вахтовый метод)</div>'+
    '<div class="small" style="margin-bottom:8px">Всего проживаний: '+rows.length+'</div>'+
    '<div style="overflow:auto"><table><tr><th>ФИО</th><th>Комн.</th><th>Прибытие</th><th>Выбытие</th><th>Сут.</th><th>Статус</th></tr>'+
    (rows.length?rows.map(function(s){var st=s['Статус']==='closed'?'закрыт':(s['Статус']==='booked'?'бронь':'на смене');
      return '<tr><td>'+esc(s['ФИО'])+'</td><td>№'+s['Комната']+'</td><td>'+fmt(s['Прибытие'])+'</td><td>'+fmt(s['Выбытие'])+'</td><td>'+nights(s['Прибытие'],s['Выбытие'])+'</td><td>'+st+'</td></tr>';
    }).join(''):'<tr><td colspan="6" class="small">Нет данных за период.</td></tr>')+'</table></div></div>';
}
loginScreen();
</script>
</body></html>
