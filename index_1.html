<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отель · учёт гостей (демо)</title>
<style>
:root{
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --panel:#f8fafc;
  --primary:#4f46e5; --primd:#4338ca; --free:#10b981; --freebg:#ecfdf5;
  --part:#f59e0b; --partbg:#fffbeb; --full:#ef4444; --fullbg:#fef2f2; --eef:#eef2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:#0b1220;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#f1f5f9;position:relative;
  display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;padding:16px 18px;
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
.top .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.top h1{font-size:16px;margin:0;font-weight:700;line-height:1.2}
.top .sub{font-size:11px;opacity:.85}
.top .right{margin-left:auto;font-size:12px;text-align:right}
.demo-badge{display:inline-block;background:#fde68a;color:#92400e;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:10px}
.content{flex:1;padding:16px;padding-bottom:80px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(15,23,42,.06);
  margin-bottom:14px}
h2{font-size:18px;margin:0 0 4px}
.small{font-size:12.5px;color:var(--muted)}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:var(--panel);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--primary)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;
  font-weight:700;background:var(--primary);color:#fff;cursor:pointer;margin-top:12px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--free)}
.btn.red{background:var(--full)}
.btn.row{display:inline-block;width:auto;padding:10px 16px;margin-top:0}
.big-choice{padding:22px 18px;border-radius:16px;text-align:center;cursor:pointer;
  color:#fff;margin-bottom:14px}
.big-choice .ic{font-size:34px}
.big-choice .t{font-size:18px;font-weight:700;margin-top:6px}
.big-choice .d{font-size:12.5px;opacity:.9;margin-top:2px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:440px){.rooms{grid-template-columns:repeat(5,1fr)}}
.room{border-radius:11px;border:1px solid var(--line);padding:8px 4px;text-align:center;
  cursor:pointer;position:relative;overflow:hidden}
.room .n{font-size:15px;font-weight:800}
.room .s{font-size:9.5px;font-weight:700;margin-top:2px}
.room.free{background:var(--freebg)} .room.free .s{color:#065f46}
.room.occ{background:var(--fullbg)} .room.occ .s{color:#991b1b}
.room.book{background:var(--partbg)} .room.book .s{color:#92400e}
.room .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.room.free .bar{background:var(--free)} .room.occ .bar{background:var(--full)} .room.book .bar{background:var(--part)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 0 12px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;
  border-top:1px solid var(--line);display:flex;z-index:6}
.tabbar button{flex:1;background:none;border:none;padding:9px 0;font-size:10.5px;color:var(--muted);cursor:pointer}
.tabbar button .ic{font-size:18px;display:block}
.tabbar button.active{color:var(--primary);font-weight:700}
.list-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  margin-bottom:9px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4338ca);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.chip.g{background:var(--freebg);color:#065f46} .chip.a{background:var(--partbg);color:#92400e}
.chip.m{background:var(--panel);color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:12px}
.tile .v{font-size:22px;font-weight:800} .tile .l{font-size:11px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;
  justify-content:center;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;
  max-height:88vh;overflow:auto}
.modal .grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;background:var(--eef);color:var(--primd);padding:8px 6px;font-size:11.5px}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
.hide{display:none}
.link{color:var(--primary);font-weight:600;text-decoration:underline;cursor:pointer;font-size:13px}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.step-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.step-dots i.on{background:var(--primary)}
.freeroom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.fr{background:var(--freebg);border:1px solid var(--line);border-radius:10px;padding:10px 2px;text-align:center;cursor:pointer;font-weight:700}
.fr.sel{background:var(--eef);border:2px solid var(--primary);color:var(--primd)}
.ok-circle{width:76px;height:76px;border-radius:50%;background:var(--freebg);display:flex;align-items:center;
  justify-content:center;margin:6px auto}
.ok-circle .c{width:52px;height:52px;border-radius:50%;background:var(--free);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px}
@media print{.top,.tabbar,.btn,.noprint{display:none!important}.wrap{max-width:100%}.content{padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">🏨</div>
    <div>
      <h1>Гостиница «Завод»</h1>
      <div class="sub" id="topSub">учёт гостей и финансов</div>
    </div>
    <div class="right"><span class="demo-badge">ДЕМО</span><div id="topRight" style="margin-top:4px"></div></div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar hide" id="tabbar"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
// ---------- storage ----------
var mem={};
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return mem[k]!==undefined?mem[k]:def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}

// ---------- seed ----------
function seed(){
  if(!load('seeded',false)){
    var vahta=[
      {id:1,fio:'Ахметов Нурлан Серикулы',company:'Завод-Инжиниринг',phone:'+7 701 234 5678',tab:'1042'},
      {id:2,fio:'Иванов Сергей Петрович',company:'Завод-Инжиниринг',phone:'+7 702 111 2233',tab:'1043'},
      {id:3,fio:'Оспанов Данияр Болатұлы',company:'Завод-Инжиниринг',phone:'+7 705 987 6543',tab:'1044'},
      {id:4,fio:'Ким Владимир Андреевич',company:'Завод-Инжиниринг',phone:'+7 700 555 4433',tab:'1045'},
      {id:5,fio:'Ержанов Асхат Маратұлы',company:'Завод-Инжиниринг',phone:'+7 707 222 1100',tab:'1046'}
    ];
    save('guests',vahta);
    save('stays',[]);
    save('finance',[]);
    save('users',[]);
    save('seeded',true);
  }
}
seed();

var ROOMS=28;
function guests(){return load('guests',[]);}
function stays(){return load('stays',[]);}
function finance(){return load('finance',[]);}
function users(){return load('users',[]);}
function session(){return load('session',null);}

function activeStayForRoom(n){
  return stays().find(function(s){return s.room==n && s.status!=='closed';});
}
function roomStatus(n){
  var s=activeStayForRoom(n);
  if(!s)return{st:'free'};
  return{st:s.status==='booked'?'book':'occ',stay:s};
}
function freeRooms(){
  var r=[];for(var n=1;n<=ROOMS;n++){if(!activeStayForRoom(n))r.push(n);}return r;
}
function nights(a,b){if(!a||!b)return'';var d=(new Date(b)-new Date(a))/86400000;return d>=0?Math.round(d):'';}
function initials(f){var p=f.trim().split(/\s+/);return((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
function fmt(d){if(!d)return'—';var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function esc(s){return(s||'').replace(/</g,'&lt;');}

// ---------- router ----------
var C=document.getElementById('content');
var TB=document.getElementById('tabbar');
function setTop(sub,right){document.getElementById('topSub').textContent=sub||'учёт гостей и финансов';
  document.getElementById('topRight').innerHTML=right||'';}

function go(screen){
  TB.classList.add('hide');
  if(screen==='landing')return landing();
  if(screen==='staffAuth')return staffAuth();
  if(screen==='admin')return admin('rooms');
  if(screen==='guest')return guest(1,{});
}

// ---------- landing ----------
function landing(){
  setTop('демо · выберите вход','');
  TB.classList.add('hide');
  C.innerHTML=
  '<div class="big-choice" style="background:linear-gradient(135deg,#4f46e5,#4338ca)" onclick="go(\'staffAuth\')">'+
    '<div class="ic">🖥️</div><div class="t">Вход для персонала</div>'+
    '<div class="d">админ / ресепшн — заселение, финансы, отчёты</div></div>'+
  '<div class="big-choice" style="background:linear-gradient(135deg,#10b981,#059669)" onclick="go(\'guest\')">'+
    '<div class="ic">📱</div><div class="t">Регистрация гостя (QR)</div>'+
    '<div class="d">гость выбирает себя, комнату и период</div></div>'+
  '<div class="card"><div class="small">Это демо для показа заказчику. Данные сохраняются в этом браузере/телефоне. '+
    'Позже подключим Google Таблицу как общую базу.</div>'+
    '<div class="link" style="margin-top:10px" onclick="resetAll()">Сбросить демо-данные</div></div>';
}
function resetAll(){if(confirm('Стереть все демо-данные и начать заново?')){try{localStorage.clear();}catch(e){mem={};}seed();save('session',null);landing();}}

// ---------- staff auth ----------
function staffAuth(){
  var us=users();
  setTop('вход для персонала','');
  if(us.length===0){
    C.innerHTML='<div class="card"><h2>Регистрация администратора</h2>'+
      '<div class="small">Первый пользователь становится админом отеля.</div>'+
      '<label>Ваше имя</label><input id="rName" placeholder="Напр. Азамат (ресепшн)">'+
      '<label>Логин</label><input id="rLogin" placeholder="admin">'+
      '<label>Пароль</label><input id="rPass" type="password" placeholder="•••••">'+
      '<button class="btn" onclick="registerAdmin()">Зарегистрироваться как админ</button>'+
      '<div class="link" style="margin-top:12px;text-align:center" onclick="go(\'landing\')">← назад</div></div>';
  }else{
    C.innerHTML='<div class="card"><h2>Вход</h2>'+
      '<div class="small">Введите логин и пароль сотрудника.</div>'+
      '<label>Логин</label><input id="lLogin" placeholder="admin">'+
      '<label>Пароль</label><input id="lPass" type="password" placeholder="•••••">'+
      '<button class="btn" onclick="doLogin()">Войти</button>'+
      '<div class="link" style="margin-top:12px" onclick="addStaff()">+ Добавить сотрудника (ресепшн)</div>'+
      '<div class="link" style="margin-top:8px;text-align:center" onclick="go(\'landing\')">← назад</div></div>';
  }
}
function registerAdmin(){
  var name=v('rName'),login=v('rLogin'),pass=v('rPass');
  if(!name||!login||!pass)return alert('Заполните все поля');
  var us=users();us.push({name:name,login:login,pass:pass,role:'admin'});save('users',us);
  save('session',{login:login,name:name,role:'admin'});
  alert('Готово! Вы вошли как администратор.');go('admin');
}
function doLogin(){
  var login=v('lLogin'),pass=v('lPass');
  var u=users().find(function(x){return x.login===login&&x.pass===pass;});
  if(!u)return alert('Неверный логин или пароль');
  save('session',{login:u.login,name:u.name,role:u.role});go('admin');
}
function addStaff(){
  var name=prompt('Имя сотрудника (ресепшн):');if(!name)return;
  var login=prompt('Логин:');if(!login)return;
  var pass=prompt('Пароль:');if(!pass)return;
  var us=users();us.push({name:name,login:login,pass:pass,role:'reception'});save('users',us);
  alert('Сотрудник добавлен. Теперь он может войти.');
}
function logout(){save('session',null);go('landing');}
function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}

// ---------- admin ----------
function admin(tab){
  var s=session();if(!s)return go('staffAuth');
  setTop(s.name+' · '+(s.role==='admin'?'админ':'ресепшн'),
    '<span class="link" style="color:#fff" onclick="logout()">выйти</span>');
  TB.classList.remove('hide');
  TB.innerHTML=[['rooms','▦','Комнаты'],['guests','👥','Гости'],['fin','₸','Финансы'],['rep','📄','Отчёт']]
    .map(function(t){return '<button class="'+(tab===t[0]?'active':'')+'" onclick="admin(\''+t[0]+'\')">'+
      '<span class="ic">'+t[1]+'</span>'+t[2]+'</button>';}).join('');
  if(tab==='rooms')return adminRooms();
  if(tab==='guests')return adminGuests();
  if(tab==='fin')return adminFin();
  if(tab==='rep')return adminRep();
}

function adminRooms(){
  var occ=0,free=0,book=0;
  var grid='';
  for(var n=1;n<=ROOMS;n++){
    var r=roomStatus(n);
    var cls=r.st==='free'?'free':(r.st==='occ'?'occ':'book');
    if(r.st==='free')free++;else if(r.st==='occ')occ++;else book++;
    var sub=r.st==='free'?'свободно':(r.st==='occ'?'занято':'бронь');
    grid+='<div class="room '+cls+'" onclick="roomClick('+n+')"><div class="bar"></div>'+
      '<div class="n">'+n+'</div><div class="s">'+sub+'</div></div>';
  }
  C.innerHTML='<div class="card"><h2>Комнаты</h2>'+
    '<div class="legend">'+
      '<span><i class="dot" style="background:var(--free)"></i>свободно</span>'+
      '<span><i class="dot" style="background:var(--full)"></i>занято</span>'+
      '<span><i class="dot" style="background:var(--part)"></i>бронь</span></div>'+
    '<div class="tiles" style="margin-bottom:12px">'+
      '<div class="tile" style="background:var(--fullbg)"><div class="v" style="color:#991b1b">'+occ+'</div><div class="l" style="color:#991b1b">занято</div></div>'+
      '<div class="tile" style="background:var(--freebg)"><div class="v" style="color:#065f46">'+free+'</div><div class="l" style="color:#065f46">свободно</div></div>'+
    '</div>'+
    '<div class="rooms">'+grid+'</div></div>';
}
function roomClick(n){
  var r=roomStatus(n);
  if(r.st==='free'){
    openCheckin(n);
  }else{
    var s=r.stay;var g=guests().find(function(x){return x.id===s.guestId;})||{fio:s.fio,company:'',phone:'',tab:''};
    var nn=nights(s.arrival,s.departure);
    modal('<h2>Комната № '+n+'</h2>'+
      '<div class="list-item"><div class="avatar">'+initials(g.fio)+'</div><div>'+
        '<div style="font-weight:700">'+esc(g.fio)+'</div>'+
        '<div class="small">'+esc(g.company||'')+' · таб. '+esc(g.tab||'—')+'</div></div>'+
        '<div style="margin-left:auto">'+(s.status==='booked'?'<span class="chip a">бронь</span>':'<span class="chip g">на смене</span>')+'</div></div>'+
      '<div class="tiles"><div class="tile" style="background:var(--freebg)"><div class="l" style="color:#065f46">Прибытие</div><div class="v" style="font-size:16px;color:#065f46">'+fmt(s.arrival)+'</div></div>'+
      '<div class="tile" style="background:var(--partbg)"><div class="l" style="color:#92400e">Выбытие</div><div class="v" style="font-size:16px;color:#92400e">'+fmt(s.departure)+'</div></div></div>'+
      '<div class="small" style="margin:10px 0">Суток по плану: <b>'+nn+'</b> · источник: '+esc(s.source||'ресепшн')+'</div>'+
      '<button class="btn red" onclick="checkout('+s.id+')">Отметить выбытие</button>'+
      '<button class="btn sec" onclick="closeModal()">Закрыть</button>');
  }
}
function openCheckin(n){
  var opts=guests().map(function(g){return '<option value="'+g.id+'">'+esc(g.fio)+' ('+esc(g.tab||'')+')</option>';}).join('');
  modal('<h2>Заселить · комната № '+n+'</h2>'+
    '<label>Гость</label><select id="ciGuest">'+opts+'</select>'+
    '<label>Прибытие</label><input type="date" id="ciArr">'+
    '<label>Выбытие</label><input type="date" id="ciDep">'+
    '<button class="btn" onclick="doCheckin('+n+')">Заселить</button>'+
    '<button class="btn sec" onclick="closeModal()">Отмена</button>');
}
function doCheckin(n){
  var gid=parseInt(document.getElementById('ciGuest').value);
  var arr=document.getElementById('ciArr').value,dep=document.getElementById('ciDep').value;
  if(!arr||!dep)return alert('Укажите период');
  var g=guests().find(function(x){return x.id===gid;});
  var st=stays();st.push({id:uid(),guestId:gid,fio:g.fio,room:n,arrival:arr,departure:dep,status:'on_shift',source:'ресепшн'});
  save('stays',st);closeModal();admin('rooms');
}
function checkout(sid){
  var st=stays();var s=st.find(function(x){return x.id===sid;});if(s){s.status='closed';
    if(!s.departure){var t=new Date();s.departure=t.toISOString().slice(0,10);}}
  save('stays',st);closeModal();admin('rooms');
}

function adminGuests(){
  var g=guests();
  C.innerHTML='<div class="card"><h2>Гости / вахта</h2>'+
    '<div class="small">Список сотрудников — его видит гость при регистрации по QR.</div>'+
    '<button class="btn row" style="margin-top:10px" onclick="addGuest()">+ Добавить сотрудника</button>'+
    '<div style="margin-top:12px">'+g.map(function(x){
      var inRoom=stays().find(function(s){return s.guestId===x.id&&s.status!=='closed';});
      return '<div class="list-item"><div class="avatar">'+initials(x.fio)+'</div>'+
        '<div style="flex:1"><div style="font-weight:600">'+esc(x.fio)+'</div>'+
        '<div class="small">'+esc(x.company||'')+' · '+esc(x.tab||'')+' · '+esc(x.phone||'')+'</div></div>'+
        (inRoom?'<span class="chip g">№'+inRoom.room+'</span>':'<span class="chip m">нет</span>')+'</div>';
    }).join('')+'</div></div>';
}
function addGuest(){
  var fio=prompt('ФИО:');if(!fio)return;
  var tab=prompt('Табельный номер:')||'';
  var phone=prompt('Телефон:')||'';
  var g=guests();g.push({id:uid(),fio:fio,company:'Завод-Инжиниринг',phone:phone,tab:tab});save('guests',g);
  admin('guests');
}

function adminFin(){
  var f=finance();
  var inc=f.filter(function(x){return x.type==='income';}).reduce(function(a,b){return a+ +b.amount;},0);
  var exp=f.filter(function(x){return x.type==='expense';}).reduce(function(a,b){return a+ +b.amount;},0);
  C.innerHTML='<div class="card"><h2>Финансы</h2>'+
    '<div class="tiles" style="margin-top:8px">'+
      '<div class="tile" style="background:var(--freebg)"><div class="l" style="color:#065f46">Доход</div><div class="v" style="font-size:18px;color:#065f46">'+money(inc)+'</div></div>'+
      '<div class="tile" style="background:var(--fullbg)"><div class="l" style="color:#991b1b">Расход</div><div class="v" style="font-size:18px;color:#991b1b">'+money(exp)+'</div></div>'+
    '</div>'+
    '<div class="tile" style="background:var(--eef);margin-top:10px"><div class="l" style="color:var(--primd)">Прибыль</div><div class="v" style="font-size:20px;color:var(--primd)">'+money(inc-exp)+'</div></div>'+
    '<button class="btn" onclick="addFin()">+ Новая операция</button></div>'+
    '<div class="card"><h2 style="font-size:15px">Операции</h2>'+
    (f.length?f.slice().reverse().map(function(x){
      var g=x.type==='income';
      return '<div class="list-item"><div style="flex:1"><div style="font-weight:600">'+esc(x.category)+'</div>'+
        '<div class="small">'+fmt(x.date)+(x.note?' · '+esc(x.note):'')+'</div></div>'+
        '<div style="font-weight:700;color:'+(g?'#065f46':'#991b1b')+'">'+(g?'+':'−')+money(Math.abs(x.amount))+'</div></div>';
    }).join(''):'<div class="small">Пока нет операций.</div>')+'</div>';
}
function money(n){return (Math.round(n)||0).toLocaleString('ru-RU')+' ₸';}
function addFin(){
  modal('<h2>Новая операция</h2>'+
    '<label>Тип</label><select id="fType"><option value="income">Доход</option><option value="expense">Расход</option></select>'+
    '<label>Категория</label><input id="fCat" placeholder="Напр. Оплата вахты / Коммуналка">'+
    '<label>Сумма, ₸</label><input id="fAmt" type="number" placeholder="0">'+
    '<label>Дата</label><input id="fDate" type="date">'+
    '<label>Комментарий</label><input id="fNote" placeholder="необязательно">'+
    '<button class="btn" onclick="saveFin()">Сохранить</button>'+
    '<button class="btn sec" onclick="closeModal()">Отмена</button>');
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
}
function saveFin(){
  var amt=parseFloat(document.getElementById('fAmt').value);
  var cat=v('fCat')||'Без категории';
  if(!amt)return alert('Укажите сумму');
  var f=finance();f.push({id:uid(),type:document.getElementById('fType').value,category:cat,
    amount:amt,date:document.getElementById('fDate').value,note:v('fNote')});save('finance',f);
  closeModal();admin('fin');
}

function adminRep(){
  var rows=stays().slice().sort(function(a,b){return (a.arrival<b.arrival)?1:-1;});
  var total=rows.reduce(function(a,s){var n=nights(s.arrival,s.departure);return a+(typeof n==='number'?n:0);},0);
  C.innerHTML='<div class="card noprint"><h2>Отчёт для завода</h2>'+
    '<div class="small">Проживания по периоду и по человеку. Кнопка ниже — печать/сохранение в PDF.</div>'+
    '<button class="btn row" style="margin-top:10px" onclick="window.print()">🖨 Печать / PDF</button></div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:6px">Отчёт о проживании вахты</div>'+
    '<div class="small" style="margin-bottom:10px">Всего проживаний: '+rows.length+' · человеко-суток: '+total+'</div>'+
    '<div style="overflow:auto"><table><tr><th>ФИО</th><th>Комн.</th><th>Прибытие</th><th>Выбытие</th><th>Сут.</th><th>Статус</th></tr>'+
    (rows.length?rows.map(function(s){
      var stt=s.status==='closed'?'закрыт':(s.status==='booked'?'бронь':'на смене');
      return '<tr><td>'+esc(s.fio)+'</td><td>№'+s.room+'</td><td>'+fmt(s.arrival)+'</td><td>'+fmt(s.departure)+'</td>'+
        '<td>'+nights(s.arrival,s.departure)+'</td><td>'+stt+'</td></tr>';
    }).join(''):'<tr><td colspan="6" class="small">Пока нет заселений. Заселите гостя или зарегистрируйте через QR.</td></tr>')+
    '</table></div></div>';
}

// ---------- guest QR flow ----------
function guest(step,data){
  setTop('регистрация гостя','<span class="link" style="color:#fff" onclick="go(\'landing\')">выход</span>');
  TB.classList.add('hide');
  var dots='<div class="step-dots">'+[1,2,3,4].map(function(i){return '<i class="'+(i<=step?'on':'')+'"></i>';}).join('')+'</div>';
  if(step===1){
    var g=guests().map(function(x){
      var busy=stays().find(function(s){return s.guestId===x.id&&s.status!=='closed';});
      return '<div class="list-item" style="cursor:pointer" onclick="guest(2,{gid:'+x.id+'})">'+
        '<div class="avatar">'+initials(x.fio)+'</div><div style="flex:1">'+
        '<div style="font-weight:600">'+esc(x.fio)+'</div><div class="small">таб. '+esc(x.tab||'')+' · '+esc(x.company||'')+'</div></div>'+
        (busy?'<span class="chip g">в отеле</span>':'<span class="chip m">›</span>')+'</div>';
    }).join('');
    C.innerHTML='<div class="card">'+dots+'<h2>Найдите себя в списке</h2>'+
      '<input id="gSearch" placeholder="🔎 поиск по фамилии" oninput="filterGuest(this.value)">'+
      '<div id="gList" style="margin-top:10px">'+g+'</div>'+
      '<div class="link" style="text-align:center;margin-top:6px" onclick="guest(1.5,{})">Меня нет в списке →</div></div>';
  }else if(step===1.5){
    C.innerHTML='<div class="card"><h2>Меня нет в списке</h2>'+
      '<label>Фамилия Имя Отчество</label><input id="ngFio">'+
      '<label>Табельный номер</label><input id="ngTab">'+
      '<label>Телефон</label><input id="ngPhone">'+
      '<button class="btn" onclick="addSelf()">Далее — выбрать комнату →</button>'+
      '<div class="link" style="text-align:center;margin-top:10px" onclick="guest(1,{})">← назад</div></div>';
  }else if(step===2){
    var fr=freeRooms();
    var grid=fr.map(function(n){return '<div class="fr" id="fr'+n+'" onclick="pickRoom('+n+')">№ '+n+'</div>';}).join('');
    window._sel=null;window._gid=data.gid;
    C.innerHTML='<div class="card">'+dots+'<h2>Выберите комнату</h2>'+
      '<div class="small">Свободных: '+fr.length+' из '+ROOMS+'. Нажмите нужную.</div>'+
      '<div class="freeroom-grid">'+grid+'</div>'+
      '<button class="btn" id="rmNext" style="opacity:.5" onclick="roomNext()">Далее →</button></div>';
  }else if(step===3){
    var g=guests().find(function(x){return x.id===data.gid;});
    window._gid=data.gid;window._room=data.room;
    C.innerHTML='<div class="card">'+dots+'<h2>Период проживания</h2>'+
      '<div class="list-item"><div class="avatar">'+initials(g.fio)+'</div><div><div style="font-weight:700">'+esc(g.fio)+'</div>'+
      '<div class="small">Комната № '+data.room+'</div></div></div>'+
      '<label>Прибытие</label><input type="date" id="gArr">'+
      '<label>Выбытие</label><input type="date" id="gDep">'+
      '<div id="gNights" class="small" style="margin-top:8px"></div>'+
      '<button class="btn green" onclick="guestConfirm()">✓ Подтвердить заезд</button></div>';
    document.getElementById('gArr').value=new Date().toISOString().slice(0,10);
    ['gArr','gDep'].forEach(function(id){document.getElementById(id).addEventListener('change',calcGN);});
  }else if(step===4){
    var s=data.stay,g=guests().find(function(x){return x.id===s.guestId;});
    C.innerHTML='<div class="card" style="text-align:center"><div class="ok-circle"><div class="c">✓</div></div>'+
      '<h2>Заезд оформлен!</h2><div class="small">Добро пожаловать, '+esc(g.fio.split(' ')[1]||g.fio)+'</div></div>'+
      '<div class="card"><table>'+
      '<tr><td class="small">Комната</td><td style="text-align:right;font-weight:600">№ '+s.room+'</td></tr>'+
      '<tr><td class="small">Период</td><td style="text-align:right;font-weight:600">'+fmt(s.arrival)+' – '+fmt(s.departure)+'</td></tr>'+
      '<tr><td class="small">Суток</td><td style="text-align:right;font-weight:600">'+nights(s.arrival,s.departure)+'</td></tr>'+
      '<tr><td class="small">Статус</td><td style="text-align:right;font-weight:600;color:#065f46">на смене</td></tr>'+
      '</table><button class="btn sec" onclick="go(\'landing\')">Готово</button></div>';
  }
}
function filterGuest(q){q=q.toLowerCase();
  document.querySelectorAll('#gList .list-item').forEach(function(el){
    el.style.display=el.textContent.toLowerCase().indexOf(q)>=0?'':'none';});}
function addSelf(){
  var fio=v('ngFio');if(!fio)return alert('Укажите ФИО');
  var g=guests();var id=uid();
  g.push({id:id,fio:fio,company:'Завод-Инжиниринг',phone:v('ngPhone'),tab:v('ngTab')});save('guests',g);
  guest(2,{gid:id});
}
function pickRoom(n){window._sel=n;
  document.querySelectorAll('.fr').forEach(function(e){e.classList.remove('sel');});
  document.getElementById('fr'+n).classList.add('sel');
  document.getElementById('rmNext').style.opacity='1';}
function roomNext(){if(!window._sel)return alert('Выберите комнату');guest(3,{gid:window._gid,room:window._sel});}
function calcGN(){var a=document.getElementById('gArr').value,b=document.getElementById('gDep').value;
  var n=nights(a,b);document.getElementById('gNights').innerHTML=n!==''?'Итого проживание: <b>'+n+' суток</b>':'';}
function guestConfirm(){
  var a=document.getElementById('gArr').value,b=document.getElementById('gDep').value;
  if(!a||!b)return alert('Укажите период');
  if(activeStayForRoom(window._room))return alert('Эту комнату только что заняли, выберите другую');
  var st=stays();var s={id:uid(),guestId:window._gid,fio:guests().find(function(x){return x.id===window._gid;}).fio,
    room:window._room,arrival:a,departure:b,status:'on_shift',source:'qr'};
  st.push(s);save('stays',st);guest(4,{stay:s});
}

// ---------- modal ----------
function modal(html){document.getElementById('modal').innerHTML='<div class="grab"></div>'+html;
  document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ---------- start ----------
if(location.hash==='#guest')go('guest');
else if(session())go('admin');
else go('landing');
</script>
</body>
</html>
